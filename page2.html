<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round 1 · Rock Paper Scissors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<button id="soundBtn" class="sound" aria-pressed="true">♪ Sound on</button>
<main id="app" data-page="round" data-round="1">
  <ol class="pips" aria-label="Round progress"><li>1</li><li>2</li><li>3</li></ol>
  <h1 class="title">Round 1</h1>
  <p class="prompt">Please choose rock, paper, or scissors:</p>
  <div class="choices">
    <button class="choice" data-choice="rock"><span class="icon">✊</span><span>Rock</span></button>
    <button class="choice" data-choice="paper"><span class="icon">✋</span><span>Paper</span></button>
    <button class="choice" data-choice="scissors"><span class="icon">✌️</span><span>Scissors</span></button>
  </div>
  <section class="arena" hidden>
    <div class="side"><p class="who">You chose</p><div class="card" id="youCard">?</div><p class="name" id="youName"></p></div>
    <div class="vs">VS</div>
    <div class="side"><p class="who">The computer chose</p><div class="card" id="cpuCard">?</div><p class="name" id="cpuName"></p></div>
  </section>
  <p id="result" class="result" aria-live="polite"></p>
  <div class="summary" hidden></div>
  <button id="nextBtn" class="cta" hidden>Next round</button>
</main>
<script src="main.js"></script>
</body>
</html>
